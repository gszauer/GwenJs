<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>GwenJs — Demo</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #2a2a2a;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #gwen-canvas { display: block; width: 100vw; height: 100vh; }
    #boot-msg {
      position: fixed; inset: 0; display: grid; place-items: center;
      pointer-events: none; font-size: 14px; opacity: 0.6;
    }
  </style>
</head>
<body>
  <canvas id="gwen-canvas"></canvas>
  <div id="boot-msg">Loading GwenJs demo&hellip;</div>
  <script src="demo.js"></script>
</body>
</html>
